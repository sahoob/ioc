trigger:
  branches:
    include:
      - main # Trigger on main branch; adjust as necessary.

pool:
  vmImage: 'ubuntu-latest' # Use an appropriate VM image.

variables:
  TF_VERSION: '1.5.0' # Specify your Terraform version.
  TF_WORKING_DIR: './terraform' # Set the directory where your Terraform files are located.
  AZURE_SERVICE_CONNECTION: 'YOUR_AZURE_SERVICE_CONNECTION_NAME' # Replace with your Azure service connection name.
  TF_VAR_example: 'value' # Define your Terraform variables here.

stages:
  - stage: Terraform_Deployment
    displayName: 'Terraform Deployment Stage'
    jobs:
      - job: Terraform_Job
        displayName: 'Run Terraform Commands'
        steps:
          - task: UseTerraform@0
            inputs:
              terraformVersion: $(TF_VERSION)

          - script: |
              echo "##[section]Initializing Terraform..."
              terraform init -input=false
            displayName: 'Terraform Init'
            workingDirectory: $(TF_WORKING_DIR)

          - script: |
              echo "##[section]Planning Terraform..."
              terraform plan -out=tfplan -input=false
            displayName: 'Terraform Plan'
            workingDirectory: $(TF_WORKING_DIR)

          - script: |
              echo "##[section]Applying Terraform..."
              terraform apply -input=false tfplan
            displayName: 'Terraform Apply'
            workingDirectory: $(TF_WORKING_DIR)
            env:
              ARM_CLIENT_ID: $(ARM_CLIENT_ID)
              ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
              ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
              ARM_TENANT_ID: $(ARM_TENANT_ID)
            condition: succeeded() # Only run if the plan step succeeds.
